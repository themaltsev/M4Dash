name: Windows installer and Portable release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Download NSIS portable compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '3.13'
          $archive = Join-Path $env:RUNNER_TEMP "nsis-$version.zip"
          $url = "https://downloads.sourceforge.net/project/nsis/NSIS%203/$version/nsis-$version.zip"
          & curl.exe --fail --location --silent --show-error --retry 5 --retry-all-errors --output $archive $url
          if ($LASTEXITCODE -ne 0) { throw "NSIS archive download failed with curl exit code $LASTEXITCODE" }
          if ((Get-Item -LiteralPath $archive).Length -lt 1MB) { throw 'Downloaded NSIS archive is unexpectedly small' }
          $nsisRoot = Join-Path $env:RUNNER_TEMP 'nsis'
          Expand-Archive -LiteralPath $archive -DestinationPath $nsisRoot -Force
          $nsisHome = Join-Path $nsisRoot "nsis-$version"
          $makensis = Join-Path $nsisHome 'Bin\makensis.exe'
          if (!(Test-Path -LiteralPath $makensis)) { throw 'makensis.exe was not found in the official NSIS archive' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "NSISDIR=$nsisHome"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $nsisHome 'Bin')
          Write-Host "NSIS compiler ready at $makensis"
      - name: Build Windows application
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Package Portable and Setup
        shell: pwsh
        run: ./scripts/build-windows-setup.ps1 -Configuration release -TargetTriple x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: M4Dash-Windows
          path: |
            artifacts/M4Dash-Portable-*.zip
            artifacts/M4Dash-Setup-*.exe
            artifacts/M4Dash-Setup-*.exe.sha256
          if-no-files-found: error
      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: M4Dash ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/M4Dash-Portable-*.zip
            artifacts/M4Dash-Setup-*.exe
            artifacts/M4Dash-Setup-*.exe.sha256
