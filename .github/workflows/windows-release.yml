name: Windows installer and Portable release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Download NSIS portable compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '3.13'
          $archive = Join-Path $env:RUNNER_TEMP "nsis-$version.zip"
          $url = "https://downloads.sourceforge.net/project/nsis/NSIS%203/$version/nsis-$version.zip"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRedirection 10
              break
            } catch {
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds (3 * $attempt)
            }
          }
          $nsisRoot = Join-Path $env:RUNNER_TEMP 'nsis'
          Expand-Archive -LiteralPath $archive -DestinationPath $nsisRoot -Force
          $nsisHome = Join-Path $nsisRoot "nsis-$version"
          $makensis = Join-Path $nsisHome 'Bin\makensis.exe'
          if (!(Test-Path -LiteralPath $makensis)) { throw 'makensis.exe was not found in the official NSIS archive' }
          "NSISDIR=$nsisHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $nsisHome 'Bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build Windows application
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Package Portable and Setup
        shell: pwsh
        run: ./scripts/build-windows-setup.ps1 -Configuration release -TargetTriple x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: M4-PC-Monitor-Windows
          path: |
            artifacts/M4PCMonitor-Portable-*.zip
            artifacts/M4-PC-Monitor-Setup-*.exe
            artifacts/M4-PC-Monitor-Setup-*.exe.sha256
          if-no-files-found: error
      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/M4PCMonitor-Portable-*.zip
            artifacts/M4-PC-Monitor-Setup-*.exe
            artifacts/M4-PC-Monitor-Setup-*.exe.sha256
